name: ImageElementStudio

options:
  bundleIdPrefix: com.imageelementstudio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true

targets:
  ImageElementStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/ImageElementStudio
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: ImageElementStudio.entitlements
    settings:
      base:
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.imageelementstudio.app
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: "Image Element Studio"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ImageElementStudioDirect.entitlements
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
          CODE_SIGN_ENTITLEMENTS: ImageElementStudio.entitlements
