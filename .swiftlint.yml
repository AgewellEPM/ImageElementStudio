# SwiftLint configuration for ImageElementStudio

excluded:
  - .build
  - Tests
  - website
  - docs

disabled_rules:
  - todo
  - nesting
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  - identifier_name

opt_in_rules:
  - force_try
  - force_cast
  - force_unwrapping
  - trailing_whitespace
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 250
  error: 400
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

type_name:
  min_length: 2
  max_length: 60

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: false

reporter: xcode
